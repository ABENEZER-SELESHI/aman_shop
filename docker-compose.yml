services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: aman_shop
      POSTGRES_USER: aman
      POSTGRES_PASSWORD: aman_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aman -d aman_shop"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://aman:aman_secret@postgres:5432/aman_shop?schema=public
      DIRECT_URL: postgresql://aman:aman_secret@postgres:5432/aman_shop?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY}
      ORDER_NOTIFY_EMAIL: ${ORDER_NOTIFY_EMAIL}
      EMAIL_FROM: ${EMAIL_FROM:-Aman Shop <orders@example.com>}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      ORDER_RATE_LIMIT_MAX: ${ORDER_RATE_LIMIT_MAX:-10}
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

volumes:
  postgres_data:
